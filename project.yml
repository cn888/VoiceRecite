name: VoiceRecite

options:
  bundleIdPrefix: com.cn888
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  VoiceRecite:
    type: application
    platform: iOS
    sources:
      - path: VoiceRecite
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: VoiceRecite/Info.plist
      properties:
        CFBundleDisplayName: 朗读闯关
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSMicrophoneUsageDescription: 需要录音来判断你是否在大声朗读
        NSSpeechRecognitionUsageDescription: 需要语音识别来判断你是否已经读完
