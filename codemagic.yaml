workflows:
  ios-unsigned:
    name: VoiceRecite unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "VoiceRecite.xcodeproj"
        XCODE_SCHEME: "VoiceRecite"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: 环境信息
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers
      - name: 安装 XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen
      - name: 生成工程
        script: |
          xcodegen generate
      - name: 编译（不签名）
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build.log | tail -n 80
      - name: 打包 IPA
        script: |
          APP=$(find build/Build/Products -maxdepth 3 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "没有产物"; exit 1; }
          echo "app: $APP"
          rm -rf Payload VoiceRecite-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VoiceRecite-unsigned.ipa Payload
          ls -lh VoiceRecite-unsigned.ipa
    artifacts:
      - VoiceRecite-unsigned.ipa
      - build.log
